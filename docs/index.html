<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Multeam</title>
  <meta name="description" content="Gestão de multas de balneário para equipas" />
  <meta name="theme-color" content="#E63946" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Multeam" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    html { overscroll-behavior: none; height: 100%; }
    body { margin: 0; padding: 0; background: #F0F1F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overscroll-behavior: none; height: 100%; overflow: hidden; }
    #root { height: 100%; overflow-y: auto; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
    #splash { position: fixed; inset: 0; background: linear-gradient(160deg, #1D3557 0%, #0a1628 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity .4s; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash-icon { width: 80px; height: 80px; border-radius: 22px; background: #E63946; display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 18px; box-shadow: 0 8px 32px rgba(230,57,70,0.5); }
    #splash h1 { color: #fff; font-size: 34px; font-weight: 900; margin: 0; letter-spacing: -1.5px; }
    #splash p { color: rgba(255,255,255,0.45); margin: 6px 0 0; font-size: 15px; }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <div id="splash-icon">🟥</div>
    <h1>Multeam</h1>
    <p>Gestão de multas de balneário</p>
  </div>

  <div id="root"></div>

  <!-- React 18 via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- App bundle -->
  <script src="app.js?v=77"></script>

  <!-- Hide splash after app loads -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hide'); setTimeout(function(){ s.remove(); }, 500); }
      }, 800);
    });

    // Pull-to-refresh + prevent Chrome default
    (function() {
      var startY = 0, pullY = 0, triggered = false, THRESHOLD = 72;
      var pill = document.createElement('div');
      pill.id = 'ptr-pill';
      pill.innerHTML = '<span id="ptr-icon">↓</span> <span id="ptr-txt">Puxar para atualizar</span>';
      pill.style.cssText = 'position:fixed;top:-56px;left:50%;transform:translateX(-50%);background:#1D3557;color:#fff;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;z-index:9998;box-shadow:0 2px 14px rgba(0,0,0,0.22);transition:top .18s ease,opacity .18s;pointer-events:none;font-family:-apple-system,sans-serif;white-space:nowrap';
      document.body.appendChild(pill);

      document.addEventListener('touchstart', function(e) {
        startY = e.touches[0].clientY;
        pullY = 0; triggered = false;
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!e.cancelable) return;
        var delta = e.touches[0].clientY - startY;
        var root = document.getElementById('root');
        if (root && delta > 0 && root.scrollTop <= 0) {
          e.preventDefault();
          pullY = delta;
          var pct = Math.min(pullY / THRESHOLD, 1);
          pill.style.top = Math.min(pullY * 0.35 - 48, 14) + 'px';
          document.getElementById('ptr-icon').style.transform = 'rotate(' + (pct * 180) + 'deg)';
          document.getElementById('ptr-txt').textContent = pullY >= THRESHOLD ? 'Soltar para atualizar' : 'Puxar para atualizar';
          if (pullY >= THRESHOLD && !triggered) { triggered = true; pill.style.background = '#2DC653'; }
          else if (pullY < THRESHOLD) { triggered = false; pill.style.background = '#1D3557'; }
          return;
        }
        pill.style.top = '-56px';
        if (root && delta < 0 && root.scrollTop + root.clientHeight >= root.scrollHeight - 2) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('touchend', function() {
        if (triggered && pullY >= THRESHOLD) {
          document.getElementById('ptr-txt').textContent = 'A atualizar...';
          document.getElementById('ptr-icon').style.display = 'none';
          setTimeout(function() { pill.style.top = '-56px'; }, 1200);
          if (window.__multeamRefresh) window.__multeamRefresh();
        } else {
          pill.style.top = '-56px';
        }
        pullY = 0; triggered = false;
      }, { passive: true });
    })();

    // PWA Service Worker - update banner (safe, no reload loops)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
          reg.addEventListener('updatefound', function() {
            var newSW = reg.installing;
            if (!newSW) return;
            newSW.addEventListener('statechange', function() {
              // New SW ready and old SW exists → show banner
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                var banner = document.createElement('div');
                banner.id = 'sw-update-banner';
                banner.innerHTML = '🔄 Nova versão disponível';
                banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#1D3557;color:#fff;text-align:center;padding:14px 16px;font-size:15px;font-weight:700;font-family:-apple-system,sans-serif;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.3)';
                banner.onclick = function() { window.location.reload(); };
                document.body.appendChild(banner);
                // Auto-reload after 4 seconds if user doesn't interact
                setTimeout(function() { window.location.reload(); }, 4000);
              }
            });
          });
        }).catch(function(){});
      });
    }
  </script>
</body>
</html>
