<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Multeam</title>
  <meta name="description" content="Gestão de multas de balneário para equipas" />
  <meta name="theme-color" content="#E63946" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Multeam" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    html { overscroll-behavior: none; height: 100%; }
    body { margin: 0; padding: 0; background: #F0F1F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overscroll-behavior: none; height: 100%; overflow: hidden; }
    #root { height: 100%; overflow-y: auto; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
    #splash { position: fixed; inset: 0; background: linear-gradient(160deg, #1D3557 0%, #0a1628 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity .4s; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash-icon { width: 90px; height: 90px; border-radius: 20px; background: #1D3557; border: 2px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 46px; margin-bottom: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    #splash h1 { color: #fff; font-size: 34px; font-weight: 900; margin: 0; letter-spacing: -1.5px; }
    #splash p { color: rgba(255,255,255,0.45); margin: 6px 0 0; font-size: 15px; }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <div id="splash-icon">⚽</div>
    <h1>Multeam</h1>
    <p>Gestão de multas de balneário</p>
  </div>

  <div id="root"></div>

  <!-- React 18 via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- App bundle -->
  <script src="app.js?v=173"></script>

  <!-- Hide splash after app loads -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hide'); setTimeout(function(){ s.remove(); }, 500); }
      }, 800);
    });

    // Pull-to-refresh (safe: only locks after clear intentional pull >= 12px)
    (function() {
      var startY = 0, pullY = 0, triggered = false, locked = false;
      var THRESHOLD = 72, MIN_LOCK = 12;
      var pill = document.createElement('div');
      pill.id = 'ptr-pill';
      pill.innerHTML = '<span id="ptr-icon">\u2193</span> <span id="ptr-txt">Puxar para atualizar</span>';
      pill.style.cssText = 'position:fixed;top:-56px;left:50%;transform:translateX(-50%);background:#1D3557;color:#fff;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;z-index:9998;box-shadow:0 2px 14px rgba(0,0,0,0.22);transition:top .18s ease,opacity .18s;pointer-events:none;font-family:-apple-system,sans-serif;white-space:nowrap';
      document.body.appendChild(pill);

      document.addEventListener('touchstart', function(e) {
        startY = e.touches[0].clientY;
        pullY = 0; triggered = false; locked = false;
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!e.cancelable) return;
        var delta = e.touches[0].clientY - startY;
        var root = document.getElementById('root');
        // Only lock into pull-to-refresh after intentional pull (>= MIN_LOCK px down, at top)
        if (!locked && root && root.scrollTop <= 0 && delta >= MIN_LOCK) {
          locked = true;
        }
        if (locked && root && root.scrollTop <= 0 && delta > 0) {
          e.preventDefault();
          pullY = delta;
          var pct = Math.min(pullY / THRESHOLD, 1);
          pill.style.top = Math.min(pullY * 0.35 - 48, 14) + 'px';
          document.getElementById('ptr-icon').style.transform = 'rotate(' + (pct * 180) + 'deg)';
          document.getElementById('ptr-txt').textContent = pullY >= THRESHOLD ? 'Soltar para atualizar' : 'Puxar para atualizar';
          if (pullY >= THRESHOLD && !triggered) { triggered = true; pill.style.background = '#2DC653'; }
          else if (pullY < THRESHOLD) { triggered = false; pill.style.background = '#1D3557'; }
        } else if (!locked) {
          pill.style.top = '-56px';
        }
      }, { passive: false });

      document.addEventListener('touchend', function() {
        if (triggered && pullY >= THRESHOLD) {
          document.getElementById('ptr-txt').textContent = 'A atualizar...';
          document.getElementById('ptr-icon').style.display = 'none';
          setTimeout(function() { pill.style.top = '-56px'; }, 1200);
          if (window.__multeamRefresh) window.__multeamRefresh();
        } else {
          pill.style.top = '-56px';
        }
        pullY = 0; triggered = false; locked = false;
      }, { passive: true });
    })();

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(){});
      });
    }
  </script>
</body>
</html>
